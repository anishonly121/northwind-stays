<!DOCTYPE html>
<html lang="en" data-page="otp" data-auth="public">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css?b=1.1.0">
  <script src="data.js?b=1.1.0"></script>
  <script src="app.js?b=1.1.0"></script>
  <title>One-time code | Northwind Stays</title>
</head>
<body>
<div class="test-banner" id="test-banner" data-testid="test-banner" role="note">Northwind Stays is a fictional test website for UAT practice. No real bookings, payments or personal data.</div>
<header class="site-header">
  <div class="container header-inner">
    <span class="brand" id="brand"><svg class="brand-mark" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true" focusable="false"><rect width="32" height="32" rx="8" fill="#17496b"/><path d="M9.5 23V9.5l13 13V9" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24.5" cy="7.5" r="2.5" fill="#f2b33d"/></svg><span class="brand-name">Northwind Stays</span></span>
  </div>
</header>
<main class="container page-narrow" id="main">
  <h1>Enter your one-time code</h1>
  <p id="otp-intro" data-testid="otp-intro">A one-time code is needed to finish signing in as <strong id="otp-email" data-testid="otp-email"></strong>.</p>
  <p class="help" id="otp-help" data-testid="otp-help">UAT test code: 123456</p>
  <form class="panel" id="otp-form" data-testid="otp-form" autocomplete="off" novalidate>
    <div class="field">
      <label for="otp-code">One-time code</label>
      <input id="otp-code" name="otp-code" type="text" inputmode="numeric" autocomplete="off" maxlength="6" data-testid="otp-code">
    </div>
    <p class="error" id="otp-error" data-testid="otp-error" role="alert" hidden></p>
    <div class="actions">
      <button type="submit" class="btn" id="verify-button" data-testid="verify-button">Verify</button>
      <a href="login.html" id="back-to-login" data-testid="back-to-login">Back to log in</a>
    </div>
  </form>
</main>
<footer class="site-footer">
  <div class="container footer-inner">
    <span class="build-label" id="build-label" data-testid="build-label">Build 1.1.0</span>
    <a href="login.html?reset=1" id="reset-demo-data" data-testid="reset-demo-data">Reset demo data</a>
  </div>
</footer>
</body>
</html>
