<!DOCTYPE html>
<html lang="en" data-page="login" data-auth="public">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css?b=1.0.0">
  <script src="data.js?b=1.0.0"></script>
  <script src="app.js?b=1.0.0"></script>
  <title>Log in | Northwind Stays</title>
</head>
<body>
<div class="test-banner" id="test-banner" data-testid="test-banner" role="note">Northwind Stays is a fictional test website for UAT practice. No real bookings, payments or personal data.</div>
<header class="site-header">
  <div class="container header-inner">
    <span class="brand" id="brand"><svg class="brand-mark" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true" focusable="false"><rect width="32" height="32" rx="8" fill="#17496b"/><path d="M9.5 23V9.5l13 13V9" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24.5" cy="7.5" r="2.5" fill="#f2b33d"/></svg><span class="brand-name">Northwind Stays</span></span>
  </div>
</header>
<main class="container page-narrow" id="main">
  <h1>Log in to Northwind Stays</h1>
  <p class="notice" id="login-message" data-testid="login-message" role="status" hidden></p>
  <form class="panel" id="login-form" data-testid="login-form" autocomplete="off" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="text" inputmode="email" autocomplete="off" spellcheck="false" data-testid="login-email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="off" data-testid="login-password">
    </div>
    <p class="error" id="login-error" data-testid="login-error" role="alert" hidden></p>
    <div class="actions">
      <button type="submit" class="btn" id="login-button" data-testid="login-button">Log in</button>
    </div>
  </form>
</main>
<footer class="site-footer">
  <div class="container footer-inner">
    <span class="build-label" id="build-label" data-testid="build-label">Build 1.0.0</span>
    <a href="login.html?reset=1" id="reset-demo-data" data-testid="reset-demo-data">Reset demo data</a>
  </div>
</footer>
</body>
</html>
