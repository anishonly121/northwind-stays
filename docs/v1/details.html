<!DOCTYPE html>
<html lang="en" data-page="details" data-auth="required">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css?b=1.0.0">
  <script src="data.js?b=1.0.0"></script>
  <script src="app.js?b=1.0.0"></script>
  <title>Property details | Northwind Stays</title>
</head>
<body>
<div class="test-banner" id="test-banner" data-testid="test-banner" role="note">Northwind Stays is a fictional test website for UAT practice. No real bookings, payments or personal data.</div>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" id="brand" href="search.html"><svg class="brand-mark" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true" focusable="false"><rect width="32" height="32" rx="8" fill="#17496b"/><path d="M9.5 23V9.5l13 13V9" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24.5" cy="7.5" r="2.5" fill="#f2b33d"/></svg><span class="brand-name">Northwind Stays</span></a>
    <nav class="site-nav" aria-label="Main">
      <span class="signed-in" id="signed-in-as" data-testid="signed-in-as"></span>
      <a href="search.html" id="nav-search" data-testid="nav-search">Search</a>
      <a href="bookings.html" id="nav-bookings" data-testid="nav-bookings">My bookings</a>
      <button type="button" class="btn btn-secondary btn-small" id="logout-button" data-testid="logout-button">Log out</button>
    </nav>
  </div>
</header>
<main class="container" id="main">
  <p class="back-link"><a href="search.html" id="back-to-results" data-testid="back-to-results">Back to results</a></p>
  <p class="error" id="details-error" data-testid="details-error" role="alert" hidden></p>
  <div id="details-content" hidden>
    <div class="details-head">
      <div class="thumb thumb-large" id="property-thumb" data-testid="property-thumb" aria-hidden="true"></div>
      <div>
        <h1 id="property-name" data-testid="property-name"></h1>
        <p class="meta"><span id="property-city" data-testid="property-city"></span> · <span id="property-type" data-testid="property-type"></span></p>
        <p class="meta"><span id="property-stars" data-testid="property-stars"></span> · Guest rating <span id="property-rating" data-testid="property-rating"></span></p>
        <p class="price price-large" id="property-price" data-testid="property-price"></p>
      </div>
    </div>
    <div class="details-layout">
      <section class="panel">
        <h2>About this property</h2>
        <p id="property-description" data-testid="property-description"></p>
        <p id="property-max-guests" data-testid="property-max-guests"></p>
        <h3>Amenities</h3>
        <ul class="amenity-list" id="property-amenities" data-testid="property-amenities"></ul>
      </section>
      <section class="panel" aria-labelledby="stay-heading">
        <h2 id="stay-heading">Your stay</h2>
        <p id="stay-checkin" data-testid="stay-checkin"></p>
        <p id="stay-checkout" data-testid="stay-checkout"></p>
        <p id="stay-nights" data-testid="stay-nights"></p>
        <p id="stay-guests" data-testid="stay-guests"></p>
        <p id="stay-rooms" data-testid="stay-rooms"></p>
        <div class="actions">
          <a class="btn" href="book.html" id="book-now" data-testid="book-now">Book now</a>
        </div>
      </section>
    </div>
  </div>
</main>
<footer class="site-footer">
  <div class="container footer-inner">
    <span class="build-label" id="build-label" data-testid="build-label">Build 1.0.0</span>
    <a href="login.html?reset=1" id="reset-demo-data" data-testid="reset-demo-data">Reset demo data</a>
  </div>
</footer>
</body>
</html>
