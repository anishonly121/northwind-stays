<!DOCTYPE html>
<html lang="en" data-page="results" data-auth="required">
<head>
  {{head}}
  <title>Search results | Northwind Stays</title>
</head>
<body>
{{banner}}
{{header_app}}
<main class="container" id="main">
  <h1>Search results</h1>
  <p class="search-summary"><span id="search-summary" data-testid="search-summary"></span> <a href="search.html" class="change-search" id="change-search" data-testid="change-search">Change search</a></p>
  <p class="error" id="results-error" data-testid="results-error" role="alert" hidden></p>
  <div class="results-layout" id="results-layout">
    <aside class="panel filters" aria-labelledby="filters-heading">
      <h2 id="filters-heading">Filters</h2>
      <form id="filter-form" data-testid="filter-form" autocomplete="off" novalidate>
        <div class="price-row">
          <div class="field">
            <label for="filter-min-price">Min price per night (S$)</label>
            <input id="filter-min-price" name="min-price" type="number" min="0" step="1" inputmode="numeric" autocomplete="off" data-testid="filter-min-price">
          </div>
          <div class="field">
            <label for="filter-max-price">Max price per night (S$)</label>
            <input id="filter-max-price" name="max-price" type="number" min="0" step="1" inputmode="numeric" autocomplete="off" data-testid="filter-max-price">
          </div>
        </div>
        <fieldset>
          <legend>Star rating</legend>
          <div class="check-row">
            <span class="check"><input type="checkbox" id="filter-star-3" value="3" data-filter-group="star" data-testid="filter-star-3"><label for="filter-star-3">3 stars</label></span>
            <span class="check"><input type="checkbox" id="filter-star-4" value="4" data-filter-group="star" data-testid="filter-star-4"><label for="filter-star-4">4 stars</label></span>
            <span class="check"><input type="checkbox" id="filter-star-5" value="5" data-filter-group="star" data-testid="filter-star-5"><label for="filter-star-5">5 stars</label></span>
          </div>
        </fieldset>
        <fieldset>
          <legend>Property type</legend>
          <div class="check-row">
            <span class="check"><input type="checkbox" id="filter-type-hotel" value="Hotel" data-filter-group="type" data-testid="filter-type-hotel"><label for="filter-type-hotel">Hotel</label></span>
            <span class="check"><input type="checkbox" id="filter-type-serviced" value="Serviced apartment" data-filter-group="type" data-testid="filter-type-serviced"><label for="filter-type-serviced">Serviced apartment</label></span>
          </div>
        </fieldset>
        <fieldset>
          <legend>Amenities</legend>
          <div class="check-grid">
            <span class="check"><input type="checkbox" id="filter-amenity-pool" value="Pool" data-filter-group="amenity" data-testid="filter-amenity-pool"><label for="filter-amenity-pool">Pool</label></span>
            <span class="check"><input type="checkbox" id="filter-amenity-gym" value="Gym" data-filter-group="amenity" data-testid="filter-amenity-gym"><label for="filter-amenity-gym">Gym</label></span>
            <span class="check"><input type="checkbox" id="filter-amenity-breakfast" value="Breakfast included" data-filter-group="amenity" data-testid="filter-amenity-breakfast"><label for="filter-amenity-breakfast">Breakfast included</label></span>
            <span class="check"><input type="checkbox" id="filter-amenity-wifi" value="Free Wi-Fi" data-filter-group="amenity" data-testid="filter-amenity-wifi"><label for="filter-amenity-wifi">Free Wi-Fi</label></span>
            <span class="check"><input type="checkbox" id="filter-amenity-parking" value="Parking" data-filter-group="amenity" data-testid="filter-amenity-parking"><label for="filter-amenity-parking">Parking</label></span>
            <span class="check"><input type="checkbox" id="filter-amenity-pets" value="Pet friendly" data-filter-group="amenity" data-testid="filter-amenity-pets"><label for="filter-amenity-pets">Pet friendly</label></span>
          </div>
        </fieldset>
        <!--#if v2-->
        <fieldset>
          <legend>Cancellation</legend>
          <div class="check-row">
            <span class="check"><input type="checkbox" id="filter-free-cancellation" value="yes" data-filter-group="cancellation" data-testid="filter-free-cancellation"><label for="filter-free-cancellation">Free cancellation</label></span>
          </div>
        </fieldset>
        <!--#endif-->
        <div class="actions">
          <button type="submit" class="btn" id="apply-filters" data-testid="apply-filters">Apply filters</button>
          <button type="button" class="btn btn-secondary" id="clear-filters" data-testid="clear-filters">Clear filters</button>
        </div>
      </form>
    </aside>
    <section class="results-main" aria-labelledby="result-count">
      <div class="results-toolbar">
        <p class="result-count" id="result-count" data-testid="result-count" role="status"></p>
        <div class="field field-inline">
          <label for="sort-by">Sort by</label>
          <select id="sort-by" name="sort-by" data-testid="sort-by">
            <option value="recommended" selected>Recommended</option>
            <option value="price-asc">Price (low to high)</option>
            <option value="price-desc">Price (high to low)</option>
            <option value="rating-desc">Rating (high to low)</option>
          </select>
        </div>
      </div>
      <div class="results-list" id="results-list" data-testid="results-list"></div>
    </section>
  </div>
</main>
{{footer}}
</body>
</html>
