<!DOCTYPE html>
<html lang="en" data-page="login" data-auth="public">
<head>
  {{head}}
  <title>Log in | Northwind Stays</title>
</head>
<body>
{{banner}}
{{header_public}}
<main class="container page-narrow" id="main">
  <h1>Log in to Northwind Stays</h1>
  <p class="notice" id="login-message" data-testid="login-message" role="status" hidden></p>
  <form class="panel" id="login-form" data-testid="login-form" autocomplete="off" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="text" inputmode="email" autocomplete="off" spellcheck="false" data-testid="login-email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="off" data-testid="login-password">
    </div>
    <p class="error" id="login-error" data-testid="login-error" role="alert" hidden></p>
    <div class="actions">
      <button type="submit" class="btn" id="login-button" data-testid="login-button">Log in</button>
    </div>
  </form>
</main>
{{footer}}
</body>
</html>
