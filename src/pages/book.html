<!DOCTYPE html>
<html lang="en" data-page="book" data-auth="required">
<head>
  {{head}}
  <title>Complete your booking | Northwind Stays</title>
</head>
<body>
{{banner}}
{{header_app}}
<main class="container" id="main">
  <h1>Complete your booking</h1>
  <p class="error" id="book-error" data-testid="book-error" role="alert" hidden></p>
  <div class="book-layout" id="book-content" hidden>
    <form class="panel" id="booking-form" data-testid="booking-form" autocomplete="off" novalidate>
      <h2>Guest details</h2>
      <div class="field">
        <label for="full-name">Full name</label>
        <input id="full-name" name="full-name" type="text" autocomplete="off" spellcheck="false" data-testid="book-full-name">
        <p class="error field-error" id="full-name-error" data-testid="full-name-error" hidden></p>
      </div>
      <div class="field">
        <label for="guest-email">Email</label>
        <input id="guest-email" name="guest-email" type="text" inputmode="email" autocomplete="off" spellcheck="false" data-testid="book-email">
        <p class="error field-error" id="guest-email-error" data-testid="email-error" hidden></p>
      </div>
      <div class="field">
        <label for="mobile">Mobile number (+65)</label>
        <input id="mobile" name="mobile" type="tel" inputmode="numeric" autocomplete="off" data-testid="book-mobile">
        <p class="error field-error" id="mobile-error" data-testid="mobile-error" hidden></p>
      </div>
      <div class="field">
        <label for="special-requests">Special requests (optional)</label>
        <textarea id="special-requests" name="special-requests" rows="3" data-testid="book-special-requests"></textarea>
      </div>
      <div class="actions">
        <button type="submit" class="btn" id="confirm-booking" data-testid="confirm-booking">Confirm booking</button>
      </div>
    </form>
    <section class="panel summary" id="booking-summary" data-testid="booking-summary" aria-labelledby="summary-heading">
      <h2 id="summary-heading">Booking summary</h2>
      <p class="summary-property" id="summary-property" data-testid="summary-property"></p>
      <p id="summary-price" data-testid="summary-price"></p>
      <p id="summary-checkin" data-testid="summary-checkin"></p>
      <p id="summary-checkout" data-testid="summary-checkout"></p>
      <p id="summary-guests" data-testid="summary-guests"></p>
      <p id="summary-nights" data-testid="summary-nights"></p>
      <p id="summary-rooms" data-testid="summary-rooms"></p>
      <p class="summary-total" id="summary-total" data-testid="summary-total"></p>
      <p id="summary-payment" data-testid="summary-payment">Payment: Pay at property</p>
    </section>
  </div>
</main>
{{footer}}
</body>
</html>
